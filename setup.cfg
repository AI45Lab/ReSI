[metadata]
name = r2ai-autoresearch
version = 0.6.0
description = ReSI: Recursive Safety Improvement Toward Resistant and Resilient AI
license = MIT
license_files =
    LICENSE
    docs/third_party/IFEVAL_LICENSE.txt
    docs/third_party/VERL_LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.package_data]
r2ai_autoresearch.formal_eval = assets/prompts/*.txt, assets/xteaming/*.yaml

[options.entry_points]
console_scripts =
    resi-research = r2ai_autoresearch.research.cli:main
    resi-evaluate = r2ai_autoresearch.research.full_evaluate:main
    resi-export = r2ai_autoresearch.research.export:main
    r2ai-research = r2ai_autoresearch.research.cli:main
    r2ai-evaluate = r2ai_autoresearch.research.full_evaluate:main
    r2ai-export = r2ai_autoresearch.research.export:main
